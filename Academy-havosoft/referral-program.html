<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Client Referral Incentive Program Training</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
  <style>
    body {
      background-color: #F9F3EA; /* LMS beige tone */
      margin: 0;
      padding: 0;
    }
    .fade-in {
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 0.6s ease, transform 0.6s ease;
    }
    .fade-in.visible {
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>
<body class="text-gray-800 font-sans antialiased">

  <div class="max-w-4xl mx-auto px-4 py-8 space-y-4">

    <!-- Header -->
    <h1 class="text-3xl font-bold text-orange-600 mb-6">
      Client Referral Incentive Program Training
    </h1>

    <!-- Accordion Section Component -->
    <template x-for="(section, index) in sections" :key="index">
      <div x-data="{ open: index === 0 }" x-intersect="$el.classList.add('visible')" class="fade-in bg-white/50 rounded-lg shadow p-4">
        <button @click="open = !open" class="w-full flex justify-between items-center text-left text-xl font-semibold text-orange-600">
          <span x-text="section.title"></span>
          <svg :class="{'rotate-180': open}" class="w-5 h-5 transform transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
          </svg>
        </button>
        <div x-show="open" x-collapse class="mt-2 text-gray-700" x-html="section.content"></div>
      </div>
    </template>

  </div>

  <script>
    document.addEventListener('alpine:init', () => {
      Alpine.data('lesson', () => ({
        sections: [
          {
            title: 'Purpose',
            content: `<p>To encourage employee participation in Havosoft International Limited’s business development efforts by recognizing and rewarding successful client referrals, thereby supporting the company’s growth and outreach.</p>`
          },
          {
            title: 'Scope',
            content: `<p>This policy applies to all full-time and part-time employees of Havosoft International Limited, except those whose roles already include commission-based incentives (e.g., Sales team members or others with client acquisition bonuses).</p>`
          },
          {
            title: 'Participation Eligibility',
            content: `
              <p>All employees are eligible to participate except:</p>
              <ul class="list-disc list-inside ml-2">
                <li>Sales team members</li>
                <li>Employees whose compensation includes client acquisition commissions or bonuses</li>
              </ul>
            `
          },
          {
            title: 'Qualifying Referrals',
            content: `
              <ul class="list-disc list-inside ml-2 space-y-1">
                <li>The referred client must be new to Havosoft.</li>
                <li>The employee must submit a Client Referral Form to the Sales Department for approval.</li>
                <li>Introduction can be made via email, memo, or in-person.</li>
                <li>The referral must be logged and acknowledged before engagement begins.</li>
              </ul>
            `
          },
          {
            title: 'Incentive Payment',
            content: `
              <p>If a referred client signs an agreement and makes full payment:</p>
              <ul class="list-disc list-inside ml-2 space-y-1">
                <li>Referring employee receives a one-time 5% commission of the net deal value.</li>
                <li>Payment is made through payroll within 7–14 business days after full payment.</li>
                <li>All payments are subject to tax and statutory deductions.</li>
              </ul>
            `
          },
          {
            title: 'Conditions and Compliance',
            content: `
              <ul class="list-disc list-inside ml-2 space-y-1">
                <li>Incentives are issued only after client agreement and full payment.</li>
                <li>Management resolves multiple claims based on evidence and timing.</li>
                <li>Employees must disclose any personal or financial connections.</li>
                <li>Client consent required for data sharing (NDPR, GDPR).</li>
              </ul>
            `
          },
          {
            title: 'Confidentiality',
            content: `<p>All referral documentation and related communications will be handled with appropriate confidentiality. Information will only be shared with relevant internal parties for validation and processing, or as required by law.</p>`
          },
          {
            title: 'No Retaliation',
            content: `<p>Employees who submit referrals in good faith are protected from retaliation. No employee will face adverse consequences for participating in the referral program, even if a referral is not approved or does not result in a deal.</p>`
          },
          {
            title: 'Dispute Resolution',
            content: `<p>Disputes related to referral ownership or commission entitlement will be reviewed by a designated panel comprising members of HR, Sales, and Legal. The decision of Management is final and binding.</p>`
          }
        ]
      }));
    });

    // Fade-in observer
    const observer = new IntersectionObserver(entries => {
      entries.forEach(entry => {
        if (entry.isIntersecting) entry.target.classList.add('visible');
      });
    }, { threshold: 0.1 });

    window.addEventListener('DOMContentLoaded', () => {
      document.querySelectorAll('.fade-in').forEach(el => observer.observe(el));
    });
  </script>

  <!-- Auto resize iframe -->
  <script src="https://cdn.jsdelivr.net/npm/iframe-resizer/js/iframeResizer.contentWindow.min.js"></script>
</body>
</html>
